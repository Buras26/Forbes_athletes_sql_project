version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: forbes_athletes_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-forbes}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Persist database data across restarts
      - postgres_data:/var/lib/postgresql/data
      # Auto-run init scripts on first start
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      # Mount data folder so COPY FROM works
      - ./data:/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-forbes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - forbes_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: forbes_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@forbes.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"

    ports:
      - "${PGADMIN_PORT:-5050}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin_servers.json:/pgadmin4/servers.json

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - forbes_net

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  forbes_net:
    driver: bridge
